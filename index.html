<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // 1. Intercept console.error and console.warn for Vite WebSocket noise in AI Studio
        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            str += ' ' + String(arguments[i]);
          }
          if (str.indexOf('[vite] failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('vite-hmr') !== -1) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            str += ' ' + String(arguments[i]);
          }
          if (str.indexOf('WebSocket') !== -1 && str.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };

        // 2. Suppress unhandled promise rejections related to WebSocket
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Provide a silent dummy WebSocket handler for 'vite-hmr' since HMR is disabled
        if (typeof window.WebSocket !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1) {
              var dummy = new EventTarget();
              dummy.send = function() {};
              dummy.close = function() {};
              dummy.readyState = 1; // OPEN
              dummy.url = url;
              dummy.protocol = 'vite-hmr';
              setTimeout(function() {
                var openEvt = new Event('open');
                dummy.dispatchEvent(openEvt);
              }, 10);
              return dummy;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
